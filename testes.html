	<script>

//vendas
// =========================================================================
// 🚀 BATERIA AMPLA DE TESTES INTEGRADOS (Venda de Mercadorias / Serviços)
// =========================================================================

const coreFiscal = new CalculadoraVendaContabil();

console.log("%c DRIVER DE TESTES: INICIANDO VALIDAÇÃO DAS REGRAS FISCAIS 2026 ", "background: #222; color: #bada55; font-size: 14px; font-weight: bold;");

// -------------------------------------------------------------------------
// CENÁRIO 1: REGIME REGULAR - Comércio Padrão com Recebimento Misto
// -------------------------------------------------------------------------
console.log("\n------------------------------------------------------------");
console.log("CENÁRIO 1: REGIME REGULAR | COMÉRCIO | MIX RECEBIMENTO (30% À Vista)");
console.log("------------------------------------------------------------");
const c1 = coreFiscal.processarVenda({
    regimeTributario: 'REGULAR',
    tipoAtividade: 'COMERCIO',
    valorTotalItens: 20000.00,
    custoMercadoriaVendida: 9000.00,
    percentualAVista: 30, // 30% dinheiro, 70% a prazo
    aliquotaIcms: 18,     // Destaque de 18% ICMS
    descontoConcedido: 0
});
console.log(c1.lancamentosContabeis);


// -------------------------------------------------------------------------
// CENÁRIO 2: REGIME REGULAR - Indústria com Desconto Concedido e Venda A Prazo
// -------------------------------------------------------------------------
console.log("\n------------------------------------------------------------");
console.log("CENÁRIO 2: REGIME REGULAR | INDÚSTRIA | DESCONTO APLICADO | A PRAZO");
console.log("------------------------------------------------------------");
const c2 = coreFiscal.processarVenda({
    regimeTributario: 'REGULAR',
    tipoAtividade: 'INDUSTRIA',
    valorTotalItens: 15000.00,
    descontoConcedido: 1500.00, // Desconto incondicional de 10%
    custoMercadoriaVendida: 6000.00,
    percentualAVista: 0,        // 100% a prazo (Duplicatas)
    aliquotaIcms: 12            // Alíquota interestadual/reduzida de 12%
});
console.log(c2.lancamentosContabeis);


// -------------------------------------------------------------------------
// CENÁRIO 3: SIMPLES NACIONAL - Comércio (Faixa 1 - Isento de Dedução)
// -------------------------------------------------------------------------
console.log("\n------------------------------------------------------------");
console.log("CENÁRIO 3: SIMPLES NACIONAL | COMÉRCIO | FAIXA 1 (RBT12 < 180k) | À VISTA");
console.log("------------------------------------------------------------");
const c3 = coreFiscal.processarVenda({
    regimeTributario: 'SIMPLES',
    tipoAtividade: 'COMERCIO',
    valorTotalItens: 5000.00,
    custoMercadoriaVendida: 2200.00,
    percentualAVista: 100, // 100% Caixa/Bancos
    faturamentoAcumulado12Meses: 120000.00 // Alíquota nominal seca de 4%
});
console.log(c3.lancamentosContabeis);


// -------------------------------------------------------------------------
// CENÁRIO 4: SIMPLES NACIONAL - Indústria (Faixa 3 - Progressiva) com Desconto
// -------------------------------------------------------------------------
console.log("\n------------------------------------------------------------");
console.log("CENÁRIO 4: SIMPLES NACIONAL | INDÚSTRIA | FAIXA 3 (Progressiva) | COM DESCONTO");
console.log("------------------------------------------------------------");
const c4 = coreFiscal.processarVenda({
    regimeTributario: 'SIMPLES',
    tipoAtividade: 'INDUSTRIA',
    valorTotalItens: 30000.00,
    descontoConcedido: 2000.00,
    custoMercadoriaVendida: 11000.00,
    percentualAVista: 50,
    faturamentoAcumulado12Meses: 650000.00 // Ativa os cálculos de alíquota efetiva (Anexo II)
});
console.log(c4.lancamentosContabeis);


// -------------------------------------------------------------------------
// CENÁRIO 5: SIMPLES NACIONAL - Prestador de Serviços (Faixa Alta - Anexo III)
// -------------------------------------------------------------------------
console.log("\n------------------------------------------------------------");
console.log("CENÁRIO 5: SIMPLES NACIONAL | PRESTAÇÃO DE SERVIÇOS | FAIXA ELEVADA (CSP)");
console.log("------------------------------------------------------------");
const c5 = coreFiscal.processarVenda({
    regimeTributario: 'SIMPLES',
    tipoAtividade: 'SERVICO',
    valorTotalItens: 50000.00,
    custoMercadoriaVendida: 15000.00, // No texto, este valor assume a conta de 'CSP'
    percentualAVista: 100,
    faturamentoAcumulado12Meses: 2100000.00 // Quinta faixa do Simples Nacional
});
console.log(c5.lancamentosContabeis);


console.log("\n%c BATERIA DE TESTES FINALIZADA COM SUCESSO! ", "background: #006400; color: #fff; font-size: 12px; font-weight: bold;");

////////////////////////////////////////////////////////////////////////////////////////
// =========================================================================
// 🚀 BATERIA DE TESTES INTEGRADOS: DEPARTAMENTO PESSOAL E CONTABILIDADE
// =========================================================================

const coreFolha = new CalculadoraFolhaContabil();

console.log("%c DRIVER DE TESTES: INICIANDO VALIDAÇÃO DE FOLHA, ENCARGOS E PROVISÕES 2026 ", "background: #1e1e1e; color: #00ff7f; font-size: 14px; font-weight: bold;");

// -------------------------------------------------------------------------
// CENÁRIO 1: MÊS COMUM (Operação Padrão com Acúmulo de Provisões)
// -------------------------------------------------------------------------
console.log("\n------------------------------------------------------------");
console.log("CENÁRIO 1: MÊS COMUM | COM ADICIONAIS (HE + AN) | ACUMULANDO PROVISÕES");
console.log("------------------------------------------------------------");
const f1 = coreFolha.processarFolha({
    salarioBase: 4500.00,
    jornadaMensal: 220,
    qtdHorasExtras: 15,     // 15 horas extras no mês
    qtdHorasNoturnas: 30,   // 30 horas noturnas no mês
    dependentes: 1,
    utilizaVT: true,
    custoRealVT: 320.00,    // Descontará o limite de 6% (R$ 270) pois é menor que o custo real
    isFerias: false,
    is13Salario: false
});
console.log(f1.lancamentosContabeis);


// -------------------------------------------------------------------------
// CENÁRIO 2: FUNCIONÁRIO GOZANDO FÉRIAS (Metade do Mês / 15 dias)
// -------------------------------------------------------------------------
console.log("\n------------------------------------------------------------");
console.log("CENÁRIO 2: GOZO DE FÉRIAS (15 DIAS) | BAIXA DA PROVISÃO DO PASSIVO");
console.log("------------------------------------------------------------");
const f2 = coreFolha.processarFolha({
    salarioBase: 6000.00,
    dependentes: 0,
    utilizaVT: false, // Sem VT no mês de férias
    isFerias: true,
    diasFerias: 15,   // Recebe 15 dias de salário + 15 dias de férias + 1/3 constitucional
    is13Salario: false
});
console.log(f2.lancamentosContabeis);


// -------------------------------------------------------------------------
// CENÁRIO 3: PAGAMENTO DE 13º SALÁRIO INTEGRAL (Fim de Ano)
// -------------------------------------------------------------------------
console.log("\n------------------------------------------------------------");
console.log("CENÁRIO 3: QUITAÇÃO DE 13º SALÁRIO INTEGRAL (12/12) | BAIXA DO PASSIVO");
console.log("------------------------------------------------------------");
const f3 = coreFolha.processarFolha({
    salarioBase: 3800.00,
    dependentes: 2,
    utilizaVT: true,
    custoRealVT: 150.00,   // O custo real (R$ 150) é menor que 6% (R$ 228), descontará R$ 150
    isFerias: false,
    is13Salario: true,
    mesesProporcionais13: 12 // 13º Integral adicionado ao bruto
});
console.log(f3.lancamentosContabeis);


// -------------------------------------------------------------------------
// CENÁRIO 4: SALÁRIO ACIMA DO TETO DO INSS (Validação de Trava Máxima)
// -------------------------------------------------------------------------
console.log("\n------------------------------------------------------------");
console.log("CENÁRIO 4: EXECUTIVO DE ALTO ESCALÃO | SALÁRIO ACIMA DO TETO DO INSS E IRRF SECO");
console.log("------------------------------------------------------------");
const f4 = coreFolha.processarFolha({
    salarioBase: 15000.00, // Muito acima do teto de R$ 8.475,55
    dependentes: 0,
    utilizaVT: false,
    isFerias: false,
    is13Salario: false
});
console.log(f4.lancamentosContabeis);


// -------------------------------------------------------------------------
// CENÁRIO 5: SALÁRIO COM ISENÇÃO DE IMPOSTO DE RENDA (Regra 2026)
// -------------------------------------------------------------------------
console.log("\n------------------------------------------------------------");
console.log("CENÁRIO 5: SALÁRIO ATÉ O LIMITE DE ISENÇÃO DO IRRF (< R$ 5.000,00)");
console.log("------------------------------------------------------------");
const f5 = coreFolha.processarFolha({
    salarioBase: 2800.00, // Isento de IRRF por lei, mas paga INSS proporcional
    dependentes: 1,
    utilizaVT: false,
    isFerias: false,
    is13Salario: false
});
console.log(f5.lancamentosContabeis);


console.log("\n%c BATERIA DE TESTES DE FOLHA FINALIZADA COM SUCESSO! ", "background: #006400; color: #fff; font-size: 12px; font-weight: bold;");


// =========================================================================
// 🚀 BATERIA DE TESTES INTEGRADOS: PRESTAÇÃO DE SERVIÇOS E RETENÇÕES
// =========================================================================

const coreServico = new CalculadoraServicoContabil();

console.log("%c DRIVER DE TESTES: INICIANDO VALIDAÇÃO DE PRESTAÇÃO DE SERVIÇOS 2026 ", "background: #111; color: #00bfff; font-size: 14px; font-weight: bold;");

// -------------------------------------------------------------------------
// CENÁRIO 1: REGIME REGULAR - Serviço sem Retenção com Recebimento à Vista
// -------------------------------------------------------------------------
console.log("\n------------------------------------------------------------");
console.log("CENÁRIO 1: REGIME REGULAR | SEM RETENÇÃO NA FONTE | RECEBIMENTO À VISTA");
console.log("------------------------------------------------------------");
const s1 = coreServico.processarServico({
    regimeTributario: 'REGULAR',
    valorTotalServico: 8000.00,
    custoServicoPrestado: 2500.00, // CSP (Mão de obra, insumos do projeto)
    percentualAVista: 100,         // 100% Caixa/Bancos
    aliquotaIss: 5,                // ISS padrão de 5%
    sofreRetencaoFonte: false,
    descontoConcedido: 0
});
console.log(s1.lancamentosContabeis);


// -------------------------------------------------------------------------
// CENÁRIO 2: REGIME REGULAR - Serviço Corporativo COM Retenção na Fonte (PIS/COFINS)
// -------------------------------------------------------------------------
console.log("\n------------------------------------------------------------");
console.log("CENÁRIO 2: REGIME REGULAR | COM RETENÇÃO NA FONTE (PJ para PJ) | A PRAZO");
console.log("------------------------------------------------------------");
const s2 = coreServico.processarServico({
    regimeTributario: 'REGULAR',
    valorTotalServico: 15000.00,
    custoServicoPrestado: 4500.00,
    percentualAVista: 0,           // 100% a prazo (Contas a Receber)
    aliquotaIss: 3,                // ISS de 3% fixado por lei municipal
    sofreRetencaoFonte: true,      // Cliente retém PIS/COFINS e paga apenas o líquido
    descontoConcedido: 0
});
console.log(s2.lancamentosContabeis);


// -------------------------------------------------------------------------
// CENÁRIO 3: REGIME REGULAR - Venda de Serviço com Desconto Concedido e Recebimento Misto
// -------------------------------------------------------------------------
console.log("\n------------------------------------------------------------");
console.log("CENÁRIO 3: REGIME REGULAR | COM DESCONTO CONCEDIDO | RECEBIMENTO MISTO (50/50)");
console.log("------------------------------------------------------------");
const s3 = coreServico.processarServico({
    regimeTributario: 'REGULAR',
    valorTotalServico: 12000.00,
    descontoConcedido: 2000.00,    // Desconto incondicional na Nota Fiscal
    custoServicoPrestado: 3500.00,
    percentualAVista: 50,          // 50% à vista, 50% a prazo
    aliquotaIss: 5,
    sofreRetencaoFonte: false
});
console.log(s3.lancamentosContabeis);


// -------------------------------------------------------------------------
// CENÁRIO 4: SIMPLES NACIONAL - Prestador Inicial (Faixa 1 - Sem Dedução)
// -------------------------------------------------------------------------
console.log("\n------------------------------------------------------------");
console.log("CENÁRIO 4: SIMPLES NACIONAL | ANEXO III | FAIXA 1 (RBT12 < 180k) | À VISTA");
console.log("------------------------------------------------------------");
const s4 = coreServico.processarServico({
    regimeTributario: 'SIMPLES',
    valorTotalServico: 6000.00,
    custoServicoPrestado: 1800.00,
    percentualAVista: 100,
    faturamentoAcumulado12Meses: 150000.00 // Alíquota nominal inicial de 6% seca
});
console.log(s4.lancamentosContabeis);


// -------------------------------------------------------------------------
// CENÁRIO 5: SIMPLES NACIONAL - Prestador Avançado (Faixa 4 - Progressiva) com Desconto
// -------------------------------------------------------------------------
console.log("\n------------------------------------------------------------");
console.log("CENÁRIO 5: SIMPLES NACIONAL | ANEXO III | FAIXA 4 (Progressiva) | COM DESCONTO");
console.log("------------------------------------------------------------");
const s5 = coreServico.processarServico({
    regimeTributario: 'SIMPLES',
    valorTotalServico: 25000.00,
    descontoConcedido: 1000.00,
    custoServicoPrestado: 8000.00,
    percentualAVista: 0,
    faturamentoAcumulado12Meses: 1200000.00 // Ativa cálculo de alíquota efetiva alta (Anexo III)
});
console.log(s5.lancamentosContabeis);


console.log("\n%c BATERIA DE TESTES DE SERVIÇOS FINALIZADA COM SUCESSO! ", "background: #002244; color: #fff; font-size: 12px; font-weight: bold;");

	</script>
